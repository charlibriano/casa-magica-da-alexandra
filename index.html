<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Casa Mágica da Alexandra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Redireciona automaticamente para o convite -->
  <meta http-equiv="refresh" content="0; url=convite-alexandra.html" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      background: radial-gradient(circle at top, #ffddff 0, #b694ff 35%, #4a2d84 100%);
      color: #fff;
      text-align: center;
      padding: 16px;
    }
    .msg {
      max-width: 420px;
    }
    .msg h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    .msg p {
      font-size: 0.95rem;
      opacity: 0.9;
    }
    .msg a {
      color: #ffe57f;
      font-weight: 600;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="msg">
    <h1>Redirecionando para o convite da Alexandra… ✨</h1>
    <p>
      Se não abrir automaticamente, toque aqui:
      <a href="convite-alexandra.html">abrir convite</a>
    </p>
  </div>

  <script>
    // Garantir redirecionamento também via JS
    setTimeout(function () {
      window.location.href = "convite-alexandra.html";
    }, 0);
  </script>
</body>
</html>
